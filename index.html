<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOC</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    padding: 16px 0;
    font-size: 1.5rem;
    font-weight: bold;
    text-align: center;
  }
  main {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  img.gif {
    max-width: 100vw;
    max-height: 70vh;
    object-fit: contain;
  }
  .caption {
    font-size: 1.25rem;
    font-weight: bold;
  }
</style>
</head>
<body>
  <header>schoolofcompany.com</header>
  <main>
    <img class="gif" src="assets/discord.gif" alt="" />
    <div class="caption">나 도메인 샀다!!</div>
  </main>
</body>
</html>
